name: Deploy Monolith

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'eu-north-1' }}

jobs:
  terraform:
    name: "Terraform Infrastructure"
    runs-on: ubuntu-latest
    outputs:
      instance_ip: ${{ steps.set-ip.outputs.instance_ip }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Validate SSH key pair from secrets
        run: |
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          DERIVED_PUBLIC="$(ssh-keygen -y -f /tmp/deploy_key | awk '{print $1" "$2}')"
          EXPECTED_PUBLIC="$(printf '%s\n' "${{ secrets.SSH_PUBLIC_KEY }}" | awk '{print $1" "$2}')"

          if [ -z "$DERIVED_PUBLIC" ] || [ -z "$EXPECTED_PUBLIC" ]; then
            echo "Chiavi SSH non valide nei secret"
            exit 1
          fi

          if [ "$DERIVED_PUBLIC" != "$EXPECTED_PUBLIC" ]; then
            echo "SSH_PRIVATE_KEY e SSH_PUBLIC_KEY non appartengono alla stessa coppia"
            exit 1
          fi

          echo "Coppia chiavi SSH valida"

      - name: Terraform Apply
        id: apply
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve
        env:
          TF_VAR_deploy_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_aws_region: ${{ env.AWS_REGION }}

      - name: Export IP
        id: set-ip
        run: |
          cd terraform
          echo "instance_ip=$(terraform output -raw ec2_public_ip)" >> $GITHUB_OUTPUT

  deploy:
    name: "Application Deploy"
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # Aggiornato a v4

      - name: Wait for SSH auth
        run: |
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          for i in {1..36}; do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i /tmp/deploy_key deploy@"${{ needs.terraform.outputs.instance_ip }}" 'echo ready' >/dev/null 2>&1; then
              echo "SSH autenticato e pronto"
              exit 0
            fi
            echo "Attendo provisioning utente deploy/authorized_keys... tentativo $i/36"
            sleep 10
          done

          echo "SSH non pronto in tempo utile"
          exit 1

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ needs.terraform.outputs.instance_ip }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            APP_DIR="$HOME/app"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            if [ ! -d "$APP_DIR/.git" ]; then
              rm -rf "$APP_DIR"
              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch --all --prune
            git checkout "${{ github.ref_name }}"
            git reset --hard "origin/${{ github.ref_name }}"

            # Configurazione variabili d'ambiente
            echo "DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}" > .env
            echo "ALLOWED_HOSTS=${{ needs.terraform.outputs.instance_ip }},localhost" >> .env
            echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
            echo "DB_USER=${{ secrets.DB_USER }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "DATABASE_URL=postgres://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@db:5432/${{ secrets.DB_NAME }}" >> .env

            if command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            else
              COMPOSE_CMD="docker compose"
            fi

            # Deploy con Docker Compose
            $COMPOSE_CMD up -d --build

            # Migrazioni Django
            $COMPOSE_CMD exec -T web python manage.py migrate --noinput
